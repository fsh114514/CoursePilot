[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coursepilot"
version = "0.1.2"
description = "Local video playback interruption assistant for macOS and Windows"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "Pillow>=10.0",
  "pytesseract>=0.3.13",
]

[project.optional-dependencies]
macos = [
  "pyobjc-framework-Cocoa>=10.3",
  "pyobjc-framework-ApplicationServices>=10.3",
  "pyobjc-framework-Quartz>=10.3",
  "pyobjc-framework-ScreenCaptureKit>=10.3",
  "pyobjc-framework-Vision>=10.3",
]
windows = [
  "pywin32>=306; sys_platform == 'win32'",
  "winsdk>=1.0.0b10; sys_platform == 'win32' and python_version < '3.13'",
]

[project.scripts]
coursepilot = "screen_watch_assistant.app:main"

[tool.setuptools.packages.find]
where = ["src"]
